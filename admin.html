<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>685 Music | Advanced Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-primary: #7C3AED;
            --brand-secondary: #4F46E5;
            --bg-base: #030712;
            --bg-surface: #0B0F19;
            --bg-input: #111827;
            --text-title: #F9FAFB;
            --text-primary: #E5E7EB;
            --text-secondary: #9CA3AF;
            --border-light: rgba(255, 255, 255, 0.08);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-primary); min-height: 100vh; }
        button { cursor: pointer; border: none; background: none; color: inherit; outline: none; }
        input, select, textarea { font-family: inherit; outline: none; }

        #toast-container { position: fixed; top: 25px; right: 25px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--border-light); border-left: 4px solid var(--brand-primary);
            padding: 16px 24px; border-radius: var(--radius-sm); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 14px; font-weight: 600; color: var(--text-title);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }

        /* ВХОД */
        #auth-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111827 0%, #030712 100%); padding: 20px; }
        .auth-card { background: var(--bg-surface); padding: 45px; border-radius: var(--radius-md); border: 1px solid var(--border-light); width: 100%; max-width: 400px; text-align: center; }
        .auth-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); color: white; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 15px; }
        .auth-input:focus { border-color: var(--brand-primary); }
        .btn-main { width: 100%; background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); color: white; padding: 16px; border-radius: var(--radius-sm); font-weight: 700; font-size: 15px; }

        /* АДМИНКА */
        #app-view { display: none; padding: 40px 60px; max-width: 1600px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
        .header-title { font-size: 28px; font-weight: 800; color: var(--text-title); display: flex; align-items: center; gap: 15px; }
        .badge-root { background: rgba(124,58,237,0.15); color: #A78BFA; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 800; border: 1px solid rgba(124,58,237,0.3); }

        /* СТАТИСТИКА (4 КАРТОЧКИ) */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 20px; display: flex; align-items: center; gap: 18px; }
        .stat-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .stat-icon.total { background: rgba(59, 130, 246, 0.1); color: #3B82F6; }
        .stat-icon.pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .stat-icon.approved { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .stat-icon.artists { background: rgba(124, 58, 237, 0.1); color: #A78BFA; }
        .stat-info h4 { font-size: 13px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
        .stat-info span { font-size: 24px; font-weight: 800; color: var(--text-title); }

        /* ПАНЕЛЬ ИНСТРУМЕНТОВ И МАССОВЫХ ДЕЙСТВИЙ */
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 20px; flex-wrap: wrap; }
        .search-box { position: relative; flex: 1; max-width: 350px; }
        .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
        .search-box input { width: 100%; background: var(--bg-surface); border: 1px solid var(--border-light); color: white; padding: 12px 12px 12px 45px; border-radius: var(--radius-sm); font-size: 14px; }
        
        .filters-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .filter-select { background: var(--bg-surface); border: 1px solid var(--border-light); color: white; padding: 12px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; cursor: pointer; }
        
        .bulk-actions { display: flex; gap: 10px; }
        .btn-bulk { background: rgba(255,255,255,0.05); border: 1px solid var(--border-light); padding: 12px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; color: var(--text-primary); transition: 0.2s; }
        .btn-bulk:hover { background: rgba(255,255,255,0.1); }
        .btn-export { background: rgba(16, 185, 129, 0.1); color: var(--success); border-color: rgba(16, 185, 129, 0.2); }

        /* КАРТОЧКА РЕЛИЗА */
        .admin-releases-grid { display: grid; gap: 20px; }
        .admin-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 25px; display: grid; grid-template-columns: 40px 2fr 1.5fr 2fr 1.2fr; gap: 20px; align-items: start; transition: var(--transition); }
        .admin-card:hover { border-color: rgba(124, 58, 237, 0.4); }

        .select-row { align-self: center; }
        .select-row input { width: 18px; height: 18px; accent-color: var(--brand-primary); cursor: pointer; }

        .rel-details h3 { font-size: 20px; color: var(--text-title); margin-bottom: 6px; font-weight: 800; }
        .rel-details p { color: var(--text-primary); font-size: 13px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
        .artist-badge { display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; font-weight: 600; }
        .dsp-tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 4px; }
        .dsp-tag { background: rgba(124,58,237,0.1); color: #A78BFA; font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 700; border: 1px solid rgba(124,58,237,0.2); }

        .rel-files { display: flex; flex-direction: column; gap: 8px; }
        .file-link { display: flex; align-items: center; gap: 8px; background: var(--bg-input); padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); font-size: 12px; font-weight: 600; color: var(--text-primary); }
        .file-link:hover { border-color: var(--brand-primary); text-decoration: none; }
        .file-link.audio i { color: #3B82F6; }
        .file-link.cover i { color: #F59E0B; }

        .rel-codes { display: flex; flex-direction: column; gap: 10px; background: var(--bg-input); padding: 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
        .code-input-group label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; display: block; margin-bottom: 3px; }
        .code-input-group input, .code-input-group textarea { width: 100%; background: var(--bg-base); border: 1px solid var(--border-light); color: white; padding: 8px 10px; border-radius: 6px; font-size: 12px; font-family: monospace; }

        .rel-actions { display: flex; flex-direction: column; gap: 10px; }
        .rel-actions select { width: 100%; background: var(--bg-input); color: white; border: 1px solid var(--border-light); padding: 10px; border-radius: var(--radius-sm); font-weight: 700; font-size: 12px; }
        .btn-save { background: var(--success); color: white; padding: 10px; border-radius: var(--radius-sm); font-weight: 700; font-size: 13px; text-align: center; }
        .btn-save:hover { background: #059669; }

        .spinner { width: 35px; height: 35px; border: 3px solid var(--border-light); border-top-color: var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 60px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media(max-width: 1400px) { .admin-card { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- АВТОРИЗАЦИЯ АДМИНА -->
    <div id="auth-view">
        <div class="auth-card">
            <div class="auth-logo" style="font-size:24px; font-weight:800; margin-bottom:15px; color:white;"><i class="fa-solid fa-shield-halved"></i> 685 <span>ADMIN</span></div>
            <input type="email" id="auth-email" class="auth-input" placeholder="E-mail администратора">
            <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
            <button class="btn-main" id="auth-btn">Войти</button>
        </div>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div id="app-view">
        <header class="header">
            <div class="header-title">
                <i class="fa-solid fa-server"></i> Панель модерации лейбла
                <span class="badge-root">ROOT SECURE</span>
            </div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <span id="admin-display-email" style="font-weight: 600; font-size: 14px; color: var(--text-secondary);"></span>
                <button id="logout-btn" style="background: rgba(239,68,68,0.1); color: var(--danger); padding: 10px 20px; border-radius: 8px; font-weight: 700; border: 1px solid rgba(239,68,68,0.2);">Выйти</button>
            </div>
        </header>

        <!-- СТАТИСТИКА (4 МЕТРИКИ) -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon total"><i class="fa-solid fa-compact-disc"></i></div>
                <div class="stat-info"><h4>Всего релизов</h4><span id="stat-total">0</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div>
                <div class="stat-info"><h4>На модерации</h4><span id="stat-pending">0</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon approved"><i class="fa-solid fa-check-circle"></i></div>
                <div class="stat-info"><h4>Одобрено</h4><span id="stat-approved">0</span></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon artists"><i class="fa-solid fa-users"></i></div>
                <div class="stat-info"><h4>Артистов</h4><span id="stat-artists">0</span></div>
            </div>
        </div>

        <!-- ТУЛБАР: ПОИСК, ФИЛЬТРЫ И МАССОВЫЕ ДЕЙСТВИЯ -->
        <div class="toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Поиск по треку, артисту, email...">
            </div>
            
            <div class="filters-group">
                <select id="status-filter" class="filter-select">
                    <option value="all">Все статусы</option>
                    <option value="Ожидает модерации">Ожидают</option>
                    <option value="Одобрено">Одобренные</option>
                    <option value="Отклонено">Отклоненные</option>
                </select>

                <select id="genre-filter" class="filter-select">
                    <option value="all">Все жанры</option>
                    <option value="Hip-Hop / Rap">Hip-Hop / Rap</option>
                    <option value="Emo-Rap / Trap">Emo-Rap / Trap</option>
                    <option value="Phonk">Phonk</option>
                    <option value="Pop">Pop</option>
                </select>
            </div>

            <div class="bulk-actions">
                <button class="btn-bulk" id="bulk-approve-btn"><i class="fa-solid fa-check-double"></i> Одобрить выбранные</button>
                <button class="btn-bulk btn-export" id="export-csv-btn"><i class="fa-solid fa-file-arrow-down"></i> Экспорт CSV</button>
            </div>
        </div>

        <!-- СПИСОК РЕЛИЗОВ -->
        <div class="admin-releases-grid" id="admin-container">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- СКРИПТЫ АДМИНКИ -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, orderBy, query, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv98EY58S0QR9TTh87u8xgX_x4QuEcZAU",
            authDomain: "music-label-e2581.firebaseapp.com",
            databaseURL: "https://music-label-e2581-default-rtdb.firebaseio.com",
            projectId: "music-label-e2581",
            storageBucket: "music-label-e2581.firebasestorage.app",
            messagingSenderId: "523951358095",
            appId: "1:523951358095:web:b09a4a0d9a910c52e070fa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "SLRsahb8YufYn4QrlSzmiLXym4x1";
        let allSubmissions = [];

        function notify(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3500);
        }

        document.getElementById('auth-btn').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch { notify("Ошибка входа", "error"); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                document.getElementById('admin-display-email').innerText = user.email;
                loadReleases();
            } else {
                signOut(auth);
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
            }
        });

        async function loadReleases() {
            const container = document.getElementById('admin-container');
            container.innerHTML = '<div class="spinner"></div>';
            
            try {
                const q = query(collection(db, "track_submissions"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                allSubmissions = [];
                
                let pendingCount = 0, approvedCount = 0;
                const uniqueArtists = new Set();

                snap.forEach(docSnap => {
                    const data = { id: docSnap.id, ...docSnap.data() };
                    allSubmissions.push(data);
                    if (data.status === 'Ожидает модерации') pendingCount++;
                    if (data.status === 'Одобрено') approvedCount++;
                    if (data.userId) uniqueArtists.add(data.userId);
                });

                document.getElementById('stat-total').innerText = allSubmissions.length;
                document.getElementById('stat-pending').innerText = pendingCount;
                document.getElementById('stat-approved').innerText = approvedCount;
                document.getElementById('stat-artists').innerText = uniqueArtists.size;

                renderList(allSubmissions);
            } catch (e) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--danger);">Ошибка загрузки базы. Проверьте права доступа.</div>';
            }
        }

        function renderList(items) {
            const container = document.getElementById('admin-container');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 50px; color: var(--text-secondary); background: var(--bg-surface); border-radius: var(--radius-md);">Релизов не найдено</div>';
                return;
            }

            items.forEach(d => {
                const isApproved = d.status === 'Одобрено' ? 'selected' : '';
                const isRejected = d.status === 'Отклонено' ? 'selected' : '';
                const isPending = d.status === 'Ожидает модерации' ? 'selected' : '';
                const isRejectedState = d.status === 'Отклонено';

                let dspHtml = '';
                if(d.platforms) d.platforms.forEach(p => dspHtml += `<span class="dsp-tag">${p}</span>`);

                container.innerHTML += `
                    <div class="admin-card" id="card-${d.id}">
                        <div class="select-row">
                            <input type="checkbox" class="release-checkbox" value="${d.id}">
                        </div>

                        <div class="rel-details">
                            <h3>${d.title}</h3>
                            <p><i class="fa-solid fa-user-astronaut"></i> ${d.artist}</p>
                            <p><i class="fa-solid fa-compact-disc"></i> ${d.type} • ${d.genre}</p>
                            <div class="artist-badge"><i class="fa-solid fa-envelope"></i> ${d.userEmail || 'Артист'}</div>
                            <div class="dsp-tags">${dspHtml}</div>
                        </div>

                        <div class="rel-files">
                            <a href="${d.audioUrl}" target="_blank" class="file-link audio"><i class="fa-solid fa-file-audio fa-lg"></i> WAV Мастер</a>
                            <a href="${d.coverUrl}" target="_blank" class="file-link cover"><i class="fa-solid fa-image fa-lg"></i> Обложка</a>
                        </div>

                        <div class="rel-codes">
                            <div class="code-input-group">
                                <label>UPC Код релиза</label>
                                <input type="text" id="upc-${d.id}" value="${d.upc || ''}" ${isRejectedState ? 'disabled' : ''} placeholder="Штрихкод релиза">
                            </div>
                            <div class="code-input-group">
                                <label>ISRC Код трека</label>
                                <input type="text" id="isrc-${d.id}" value="${d.isrc || ''}" ${isRejectedState ? 'disabled' : ''} placeholder="Международный код">
                            </div>
                            <div class="code-input-group">
                                <label>Причина отклонения</label>
                                <textarea id="reason-${d.id}" rows="2" placeholder="Обязательно при отказе...">${d.rejectReason || ''}</textarea>
                            </div>
                        </div>

                        <div class="rel-actions">
                            <select id="status-${d.id}" onchange="handleStatusChange('${d.id}')">
                                <option value="Ожидает модерации" ${isPending}>Ожидает модерации</option>
                                <option value="Одобрено" ${isApproved}>Одобрено</option>
                                <option value="Отклонено" ${isRejected}>Отклонено</option>
                            </select>
                            <button class="btn-save" data-id="${d.id}">Сохранить</button>
                        </div>
                    </div>`;
            });

            // Сохранение одиночного релиза
            document.querySelectorAll('.btn-save').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const status = document.getElementById(`status-${id}`).value;
                    const upc = document.getElementById(`upc-${id}`).value.trim();
                    const isrc = document.getElementById(`isrc-${id}`).value.trim();
                    const rejectReason = document.getElementById(`reason-${id}`).value.trim();

                    if(status === 'Отклонено' && !rejectReason) {
                        return notify("Укажите причину отклонения релиза!", "error");
                    }

                    try {
                        await updateDoc(doc(db, "track_submissions", id), {
                            status, 
                            upc: status === 'Отклонено' ? '' : upc, 
                            isrc: status === 'Отклонено' ? '' : isrc, 
                            rejectReason: status === 'Отклонено' ? rejectReason : ''
                        });
                        notify("Изменения сохранены!");
                    } catch {
                        notify("Ошибка сохранения", "error");
                    }
                });
            });
        }

        window.handleStatusChange = (id) => {
            const status = document.getElementById(`status-${id}`).value;
            const upcInp = document.getElementById(`upc-${id}`);
            const isrcInp = document.getElementById(`isrc-${id}`);
            if (status === 'Отклонено') {
                upcInp.disabled = true; upcInp.value = '';
                isrcInp.disabled = true; isrcInp.value = '';
            } else {
                upcInp.disabled = false;
                isrcInp.disabled = false;
            }
        };

        // ФИЛЬТРАЦИЯ И ПОИСК
        function applyFilters() {
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            const statusVal = document.getElementById('status-filter').value;
            const genreVal = document.getElementById('genre-filter').value;

            const filtered = allSubmissions.filter(item => {
                const matchSearch = item.title.toLowerCase().includes(searchVal) || 
                                    item.artist.toLowerCase().includes(searchVal) || 
                                    (item.userEmail && item.userEmail.toLowerCase().includes(searchVal));
                const matchStatus = statusVal === 'all' || item.status === statusVal;
                const matchGenre = genreVal === 'all' || item.genre === genreVal;

                return matchSearch && matchStatus && matchGenre;
            });

            renderList(filtered);
        }

        document.getElementById('search-input').addEventListener('input', applyFilters);
        document.getElementById('status-filter').addEventListener('change', applyFilters);
        document.getElementById('genre-filter').addEventListener('change', applyFilters);

        // МАССОВОЕ ОДОБРЕНИЕ ВЫБРАННЫХ
        document.getElementById('bulk-approve-btn').addEventListener('click', async () => {
            const checkedBoxes = document.querySelectorAll('.release-checkbox:checked');
            if (checkedBoxes.length === 0) return notify("Выберите хотя бы один релиз галочкой", "error");

            if (!confirm(`Одобрить выбранные релизы (${checkedBoxes.length} шт.)?`)) return;

            try {
                const batch = writeBatch(db);
                checkedBoxes.forEach(cb => {
                    const ref = doc(db, "track_submissions", cb.value);
                    batch.update(ref, { status: "Одобрено" });
                });
                await batch.commit();
                notify("Выбранные релизы успешно одобрены!");
                loadReleases();
            } catch {
                notify("Ошибка массового одобрения", "error");
            }
        });

        // ЭКСПОРТ В CSV
        document.getElementById('export-csv-btn').addEventListener('click', () => {
            if (allSubmissions.length === 0) return notify("Нет данных для экспорта", "error");

            let csvContent = "data:text/csv;charset=utf-8,ID,Title,Artist,Email,Status,UPC,ISRC\n";
            allSubmissions.forEach(row => {
                csvContent += `"${row.id}","${row.title}","${row.artist}","${row.userEmail || ''}","${row.status}","${row.upc || ''}","${row.isrc || ''}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "685_music_releases.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            notify("Экспорт базы в CSV выполнен!");
        });
    </script>
</body>
</html>
