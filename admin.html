<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>685 Music | Moderation Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-primary: #7C3AED;
            --brand-secondary: #4F46E5;
            --bg-base: #030712;
            --bg-surface: #0B0F19;
            --bg-input: #111827;
            --text-title: #F9FAFB;
            --text-primary: #E5E7EB;
            --text-secondary: #9CA3AF;
            --border-light: rgba(255, 255, 255, 0.08);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --radius-md: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-primary); min-height: 100vh; }
        button { cursor: pointer; border: none; background: none; color: inherit; outline: none; }
        input, select, textarea { font-family: inherit; outline: none; }

        #toast-container { position: fixed; top: 25px; right: 25px; z-index: 10000; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--border-light); border-left: 4px solid var(--brand-primary);
            padding: 16px 24px; border-radius: var(--radius-sm); box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 14px; font-weight: 600; color: var(--text-title);
            transform: translateX(120%); transition: transform 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }

        #auth-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at center, #111827 0%, #030712 100%); padding: 20px; }
        .auth-card { background: var(--bg-surface); padding: 45px; border-radius: var(--radius-md); border: 1px solid var(--border-light); width: 100%; max-width: 400px; text-align: center; }
        .auth-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); color: white; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 15px; }
        .auth-input:focus { border-color: var(--brand-primary); }
        .btn-main { width: 100%; background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); color: white; padding: 16px; border-radius: var(--radius-sm); font-weight: 700; font-size: 15px; }

        #app-view { display: none; padding: 40px 60px; max-width: 1500px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 35px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
        .header-title { font-size: 28px; font-weight: 800; color: var(--text-title); }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 35px; }
        .stat-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 25px; display: flex; align-items: center; gap: 20px; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .stat-icon.total { background: rgba(59, 130, 246, 0.1); color: #3B82F6; }
        .stat-icon.pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .stat-icon.approved { background: rgba(16, 185, 129, 0.1); color: var(--success); }

        .admin-releases-grid { display: grid; gap: 20px; }
        .admin-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 30px; display: grid; grid-template-columns: 2fr 1.5fr 2fr 1.2fr; gap: 25px; align-items: start; }

        .rel-details h3 { font-size: 22px; color: var(--text-title); margin-bottom: 8px; font-weight: 800; }
        .rel-details p { color: var(--text-primary); font-size: 14px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
        .artist-badge { display: inline-block; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 6px; font-size: 12px; color: var(--text-secondary); margin-top: 8px; font-weight: 600; }
        
        .rel-files { display: flex; flex-direction: column; gap: 10px; }
        .file-link { display: flex; align-items: center; gap: 10px; background: var(--bg-input); padding: 12px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); font-size: 13px; font-weight: 600; color: var(--text-primary); }
        .file-link.audio i { color: #3B82F6; }
        .file-link.cover i { color: #F59E0B; }

        .rel-codes { display: flex; flex-direction: column; gap: 12px; background: var(--bg-input); padding: 20px; border-radius: var(--radius-sm); border: 1px solid var(--border-light); }
        .code-input-group label { font-size: 11px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; display: block; margin-bottom: 4px; }
        .code-input-group input, .code-input-group textarea { width: 100%; background: var(--bg-base); border: 1px solid var(--border-light); color: white; padding: 10px 12px; border-radius: 6px; font-size: 13px; font-family: monospace; }
        
        .rel-actions { display: flex; flex-direction: column; gap: 12px; }
        .rel-actions select { width: 100%; background: var(--bg-input); color: white; border: 1px solid var(--border-light); padding: 12px; border-radius: var(--radius-sm); font-weight: 700; }
        .btn-save { background: var(--success); color: white; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; text-align: center; }

        .spinner { width: 35px; height: 35px; border: 3px solid var(--border-light); border-top-color: var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 60px auto; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="auth-view">
        <div class="auth-card">
            <h2 style="color:white; margin-bottom:20px;">ADMIN PORTAL</h2>
            <input type="email" id="auth-email" class="auth-input" placeholder="E-mail">
            <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
            <button class="btn-main" id="auth-btn">Войти</button>
        </div>
    </div>

    <div id="app-view">
        <header class="header">
            <div class="header-title">Модерация релизов</div>
            <button id="logout-btn" style="background: rgba(239,68,68,0.1); color: var(--danger); padding: 10px 20px; border-radius: 8px; font-weight: 700;">Выйти</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-icon total"><i class="fa-solid fa-compact-disc"></i></div><div><h4>Всего</h4><span id="stat-total">0</span></div></div>
            <div class="stat-card"><div class="stat-icon pending"><i class="fa-solid fa-clock"></i></div><div><h4>Ожидают</h4><span id="stat-pending">0</span></div></div>
            <div class="stat-card"><div class="stat-icon approved"><i class="fa-solid fa-check-circle"></i></div><div><h4>Одобрено</h4><span id="stat-approved">0</span></div></div>
        </div>

        <div class="admin-releases-grid" id="admin-container">
            <div class="spinner"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv98EY58S0QR9TTh87u8xgX_x4QuEcZAU",
            authDomain: "music-label-e2581.firebaseapp.com",
            databaseURL: "https://music-label-e2581-default-rtdb.firebaseio.com",
            projectId: "music-label-e2581",
            storageBucket: "music-label-e2581.firebasestorage.app",
            messagingSenderId: "523951358095",
            appId: "1:523951358095:web:b09a4a0d9a910c52e070fa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "SLRsahb8YufYn4QrlSzmiLXym4x1";

        function notify(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3500);
        }

        document.getElementById('auth-btn').addEventListener('click', async () => {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } catch { notify("Ошибка входа", "error"); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                loadReleases();
            } else {
                signOut(auth);
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
            }
        });

        async function loadReleases() {
            const container = document.getElementById('admin-container');
            container.innerHTML = '<div class="spinner"></div>';
            
            const q = query(collection(db, "track_submissions"), orderBy("createdAt", "desc"));
            const snap = await getDocs(q);
            container.innerHTML = '';
            
            let total = 0, pending = 0, approved = 0;

            snap.forEach(documentSnapshot => {
                const id = documentSnapshot.id;
                const d = documentSnapshot.data();
                total++;
                if(d.status === 'Ожидает модерации') pending++;
                if(d.status === 'Одобрено') approved++;

                const isApproved = d.status === 'Одобрено' ? 'selected' : '';
                const isRejected = d.status === 'Отклонено' ? 'selected' : '';
                const isPending = d.status === 'Ожидает модерации' ? 'selected' : '';
                
                // Если статус отклонен, блокируем поля кодов и показываем причину
                const isRejectedState = d.status === 'Отклонено';

                container.innerHTML += `
                    <div class="admin-card" id="card-${id}">
                        <div class="rel-details">
                            <h3>${d.title}</h3>
                            <p><i class="fa-solid fa-user"></i> ${d.artist}</p>
                            <p><i class="fa-solid fa-compact-disc"></i> ${d.type} • ${d.genre}</p>
                            <div class="artist-badge"><i class="fa-solid fa-envelope"></i> ${d.userEmail || 'Артист'}</div>
                        </div>

                        <div class="rel-files">
                            <a href="${d.audioUrl}" target="_blank" class="file-link audio"><i class="fa-solid fa-file-audio"></i> WAV Мастер</a>
                            <a href="${d.coverUrl}" target="_blank" class="file-link cover"><i class="fa-solid fa-image"></i> Обложка</a>
                        </div>

                        <div class="rel-codes">
                            <div class="code-input-group">
                                <label>UPC Код</label>
                                <input type="text" id="upc-${id}" value="${d.upc || ''}" ${isRejectedState ? 'disabled' : ''} placeholder="Штрихкод релиза">
                            </div>
                            <div class="code-input-group">
                                <label>ISRC Код</label>
                                <input type="text" id="isrc-${id}" value="${d.isrc || ''}" ${isRejectedState ? 'disabled' : ''} placeholder="Код трека">
                            </div>
                            <div class="code-input-group">
                                <label>Причина отклонения (если отказ)</label>
                                <textarea id="reason-${id}" rows="2" placeholder="Укажите почему релиз отклонен...">${d.rejectReason || ''}</textarea>
                            </div>
                        </div>

                        <div class="rel-actions">
                            <select id="status-${id}" onchange="handleStatusChange('${id}')">
                                <option value="Ожидает модерации" ${isPending}>Ожидает модерации</option>
                                <option value="Одобрено" ${isApproved}>Одобрено</option>
                                <option value="Отклонено" ${isRejected}>Отклонено</option>
                            </select>
                            <button class="btn-save" data-id="${id}">Сохранить</button>
                        </div>
                    </div>`;
            });

            document.getElementById('stat-total').innerText = total;
            document.getElementById('stat-pending').innerText = pending;
            document.getElementById('stat-approved').innerText = approved;

            // Обработчики сохранения
            document.querySelectorAll('.btn-save').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    const status = document.getElementById(`status-${id}`).value;
                    const upc = document.getElementById(`upc-${id}`).value.trim();
                    const isrc = document.getElementById(`isrc-${id}`).value.trim();
                    const rejectReason = document.getElementById(`reason-${id}`).value.trim();

                    if(status === 'Отклонено' && !rejectReason) {
                        return notify("Укажите причину отклонения релиза!", "error");
                    }

                    try {
                        await updateDoc(doc(db, "track_submissions", id), {
                            status, upc: status === 'Отклонено' ? '' : upc, isrc: status === 'Отклонено' ? '' : isrc, rejectReason
                        });
                        notify("Успешно сохранено!");
                    } catch {
                        notify("Ошибка сохранения", "error");
                    }
                });
            });
        }

        // Динамическое отключение полей при выборе статуса "Отклонено"
        window.handleStatusChange = (id) => {
            const status = document.getElementById(`status-${id}`).value;
            const upcInp = document.getElementById(`upc-${id}`);
            const isrcInp = document.getElementById(`isrc-${id}`);
            if (status === 'Отклонено') {
                upcInp.disabled = true; upcInp.value = '';
                isrcInp.disabled = true; isrcInp.value = '';
            } else {
                upcInp.disabled = false;
                isrcInp.disabled = false;
            }
        }
    </script>
</body>
</html>
