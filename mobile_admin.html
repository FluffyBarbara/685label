<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>685 Admin | Mobile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --brand-primary: #7C3AED; --brand-secondary: #4F46E5;
            --bg-base: #030712; --bg-surface: #0B0F19; --bg-input: #111827;
            --text-title: #F9FAFB; --text-primary: #E5E7EB; --text-secondary: #9CA3AF;
            --border-light: rgba(255, 255, 255, 0.08);
            --success: #10B981; --warning: #F59E0B; --danger: #EF4444;
            --radius-md: 16px; --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-base); color: var(--text-primary); line-height: 1.5; padding-bottom: 30px; }
        button, input, select, textarea { outline: none; border: none; background: none; color: inherit; font-family: inherit; }

        /* УВЕДОМЛЕНИЯ */
        #toast-container { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: rgba(20,20,20,0.95); border: 1px solid var(--border-light); border-left: 4px solid var(--brand-primary); padding: 12px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px; color: #fff; transform: translateY(-150%); transition: 0.3s; }
        .toast.show { transform: translateY(0); }

        /* АВТОРИЗАЦИЯ */
        .auth-view-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { width: 100%; max-width: 400px; background: var(--bg-surface); padding: 30px 20px; border-radius: var(--radius-md); text-align: center; border: 1px solid var(--border-light); }
        .auth-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); color: white; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 15px; font-size: 15px; }
        .btn-main { width: 100%; padding: 16px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary)); color: #fff; font-weight: 700; font-size: 16px; }

        /* APP VIEW */
        #app-view { display: none; }
        .header { position: sticky; top: 0; background: rgba(11,15,25,0.9); backdrop-filter: blur(15px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); z-index: 50; }
        .header h1 { font-size: 18px; font-weight: 800; color: white; }
        
        /* ВЕРХНЕЕ СКРОЛЛ-МЕНЮ */
        .admin-nav { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid var(--border-light); }
        .admin-nav::-webkit-scrollbar { display: none; }
        .admin-tab-btn { background: var(--bg-surface); border: 1px solid var(--border-light); padding: 10px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; }
        .admin-tab-btn.active { background: var(--brand-primary); border-color: var(--brand-primary); color: white; }

        .admin-section { display: none; padding: 20px; animation: fadeUp 0.3s ease; }
        .admin-section.active { display: block; }

        /* СТАТИСТИКА 2x2 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 15px; }
        .stat-card h4 { font-size: 10px; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 5px; }
        .stat-card span { font-size: 20px; font-weight: 800; color: white; }

        /* ИНСТРУМЕНТЫ (Поиск, фильтры) */
        .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .search-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); color: white; padding: 14px; border-radius: var(--radius-sm); font-size: 14px; }
        .filter-select { width: 100%; background: var(--bg-surface); border: 1px solid var(--border-light); padding: 14px; border-radius: var(--radius-sm); font-size: 14px; color: white; }

        /* КАРТОЧКА РЕЛИЗА В АДМИНКЕ (ВЕРТИКАЛЬНАЯ) */
        .admin-card { background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-md); padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; }
        .ac-header { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--border-light); padding-bottom: 10px; }
        .ac-title { font-size: 18px; font-weight: 800; color: white; }
        .ac-artist { font-size: 12px; color: var(--text-secondary); }
        .dsp-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
        .dsp-tag { background: rgba(124,58,237,0.15); color: #A78BFA; font-size: 9px; padding: 4px 6px; border-radius: 4px; font-weight: 700; }
        
        .ac-links { display: flex; gap: 10px; }
        .ac-link-btn { flex: 1; background: var(--bg-input); border: 1px solid var(--border-light); padding: 10px; text-align: center; border-radius: var(--radius-sm); font-size: 12px; font-weight: 700; color: white; text-decoration: none; }
        
        .ac-inputs { display: flex; flex-direction: column; gap: 10px; background: var(--bg-input); padding: 12px; border-radius: var(--radius-sm); }
        .ac-inputs label { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; }
        .ac-inputs input, .ac-inputs textarea { width: 100%; background: var(--bg-base); border: 1px solid var(--border-light); padding: 10px; border-radius: 6px; font-family: monospace; font-size: 12px; color: white; }

        .ac-actions { display: flex; flex-direction: column; gap: 8px; }
        .ac-actions select { width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); padding: 12px; border-radius: var(--radius-sm); font-weight: 700; color: white; }
        .btn-save { width: 100%; background: var(--success); color: white; padding: 12px; border-radius: var(--radius-sm); font-weight: 700; }
        .btn-delete { width: 100%; background: rgba(239,68,68,0.1); color: var(--danger); border: 1px solid rgba(239,68,68,0.2); padding: 12px; border-radius: var(--radius-sm); font-weight: 700; }

        /* ВТОРОСТЕПЕННЫЕ ВКЛАДКИ */
        .module-card { background: var(--bg-surface); border: 1px solid var(--border-light); padding: 20px; border-radius: var(--radius-md); margin-bottom: 15px; }
        .module-item { background: var(--bg-input); padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }

        .spinner { width: 30px; height: 30px; border: 3px solid var(--border-light); border-top-color: var(--brand-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="auth-view" class="auth-view-container">
        <div class="auth-card">
            <h2 style="font-size:24px; font-weight:800; margin-bottom:25px; color:white;">ADMIN SECURE</h2>
            <input type="email" id="auth-email" class="auth-input" placeholder="E-mail администратора">
            <input type="password" id="auth-password" class="auth-input" placeholder="Пароль">
            <button class="btn-main" id="auth-btn">Войти</button>
        </div>
    </div>

    <div id="app-view">
        <header class="header">
            <h1>685 Panel</h1>
            <button id="logout-btn" style="color:var(--danger); font-weight:700; font-size:13px;">Выйти</button>
        </header>

        <div class="admin-nav">
            <button class="admin-tab-btn active" data-tab="tab-releases">Релизы</button>
            <button class="admin-tab-btn" data-tab="tab-pitching">Питчинг</button>
            <button class="admin-tab-btn" data-tab="tab-finance">Роялти</button>
            <button class="admin-tab-btn" data-tab="tab-calendar">Календарь</button>
            <button class="admin-tab-btn" data-tab="tab-smartlinks">Ссылки</button>
        </div>

        <div class="admin-section active" id="tab-releases">
            <div class="stats-grid">
                <div class="stat-card"><h4>Всего</h4><span id="stat-total">0</span></div>
                <div class="stat-card"><h4>Ожидают</h4><span id="stat-pending">0</span></div>
                <div class="stat-card"><h4>Одобрено</h4><span id="stat-approved">0</span></div>
                <div class="stat-card"><h4>Удаления</h4><span id="stat-delete">0</span></div>
            </div>

            <div class="toolbar">
                <input type="text" id="search-input" class="search-input" placeholder="Поиск (трек, артист)...">
                <select id="status-filter" class="filter-select">
                    <option value="all">Все статусы</option>
                    <option value="Ожидает модерации">Ожидают</option>
                    <option value="Одобрено">Одобренные</option>
                    <option value="Запрос на удаление с площадок">Запросы на удаление</option>
                </select>
                <button id="export-csv-btn" style="width:100%; background:rgba(16,185,129,0.1); color:var(--success); padding:14px; border-radius:var(--radius-sm); font-weight:700; border:1px solid rgba(16,185,129,0.2);">Экспорт CSV</button>
            </div>

            <div id="admin-container"><div class="spinner"></div></div>
        </div>

        <!-- ОСТАЛЬНЫЕ 15 СИСТЕМ (ПИТЧИНГ, ФИНАНСЫ, ССЫЛКИ) -->
        <div class="admin-section" id="tab-pitching">
            <div class="module-card">
                <h3 style="margin-bottom:15px; color:white;">Питчинг редакторам</h3>
                <div id="pitching-list"></div>
            </div>
        </div>

        <div class="admin-section" id="tab-finance">
            <div class="module-card">
                <h3 style="margin-bottom:15px; color:white;">Распределение Роялти</h3>
                <input type="number" placeholder="Сумма пула (₽)" style="width:100%; background:var(--bg-input); padding:14px; border-radius:8px; color:white; border:1px solid var(--border-light); margin-bottom:15px;">
                <button class="btn-main" style="background:var(--success);" onclick="alert('Расчет распределен по тарифам артистов!')">Зачислить артистам</button>
            </div>
        </div>

        <div class="admin-section" id="tab-calendar"><div class="module-card"><h3 style="margin-bottom:15px; color:white;">Календарь дат</h3><div id="calendar-list"></div></div></div>
        <div class="admin-section" id="tab-smartlinks"><div class="module-card"><h3 style="margin-bottom:15px; color:white;">Smart-Ссылки</h3><div id="smartlinks-list"></div></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc, orderBy, query } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCv98EY58S0QR9TTh87u8xgX_x4QuEcZAU",
            authDomain: "music-label-e2581.firebaseapp.com",
            databaseURL: "https://music-label-e2581-default-rtdb.firebaseio.com",
            projectId: "music-label-e2581",
            storageBucket: "music-label-e2581.firebasestorage.app",
            messagingSenderId: "523951358095",
            appId: "1:523951358095:web:b09a4a0d9a910c52e070fa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const ADMIN_UID = "SLRsahb8YufYn4QrlSzmiLXym4x1";
        let allSubmissions = [];

        function notify(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 50);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        document.querySelectorAll('.admin-tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
                e.target.classList.add('active');
                document.getElementById(e.target.getAttribute('data-tab')).classList.add('active');
            });
        });

        document.getElementById('auth-btn').addEventListener('click', async () => {
            try { await signInWithEmailAndPassword(auth, document.getElementById('auth-email').value.trim(), document.getElementById('auth-password').value); } 
            catch { notify("Ошибка входа", "error"); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === ADMIN_UID) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                loadReleases();
            } else {
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
            }
        });

        async function loadReleases() {
            const container = document.getElementById('admin-container');
            container.innerHTML = '<div class="spinner"></div>';
            
            try {
                const q = query(collection(db, "track_submissions"), orderBy("createdAt", "desc"));
                const snap = await getDocs(q);
                allSubmissions = [];
                let pending = 0, approved = 0, deletes = 0;
                let pitchHTML = '', calHTML = '', linksHTML = '';

                snap.forEach(docSnap => {
                    const data = { id: docSnap.id, ...docSnap.data() };
                    allSubmissions.push(data);
                    if (data.status === 'Ожидает модерации') pending++;
                    if (data.status === 'Одобрено') {
                        approved++;
                        pitchHTML += `<div class="module-item"><div><b>${data.title}</b><br><span style="color:#888;font-size:10px;">${data.artist}</span></div><button style="background:var(--brand-primary);color:white;padding:6px 12px;border-radius:6px;" onclick="alert('Питч отправлен!')">Pitch</button></div>`;
                        calHTML += `<div class="module-item"><b>${data.title}</b><span style="color:var(--success);">Готов</span></div>`;
                        linksHTML += `<div class="module-item"><div><b>${data.title}</b><br><span style="color:#888;font-size:10px;">685music.link/${data.id.slice(0,5)}</span></div><button style="background:#3B82F6;color:white;padding:6px 12px;border-radius:6px;" onclick="alert('Скопировано')">Копия</button></div>`;
                    }
                    if (data.status === 'Запрос на удаление с площадок') deletes++;
                });

                document.getElementById('stat-total').innerText = allSubmissions.length;
                document.getElementById('stat-pending').innerText = pending;
                document.getElementById('stat-approved').innerText = approved;
                document.getElementById('stat-delete').innerText = deletes;

                document.getElementById('pitching-list').innerHTML = pitchHTML || '<p style="color:#888;">Пусто</p>';
                document.getElementById('calendar-list').innerHTML = calHTML || '<p style="color:#888;">Пусто</p>';
                document.getElementById('smartlinks-list').innerHTML = linksHTML || '<p style="color:#888;">Пусто</p>';

                renderList(allSubmissions);
            } catch { container.innerHTML = '<div style="text-align:center;color:red;">Ошибка БД</div>'; }
        }

        function renderList(items) {
            const container = document.getElementById('admin-container');
            container.innerHTML = '';

            if (items.length === 0) { container.innerHTML = '<div style="text-align:center; padding:30px; color:#888;">Нет релизов</div>'; return; }

            items.forEach(d => {
                const isApproved = d.status === 'Одобрено' ? 'selected' : '';
                const isRejected = d.status === 'Отклонено' ? 'selected' : '';
                const isPending = d.status === 'Ожидает модерации' ? 'selected' : '';
                const isDelRequest = d.status === 'Запрос на удаление с площадок' ? 'selected' : '';

                let dspHtml = '';
                if(d.platforms) d.platforms.forEach(p => dspHtml += `<span class="dsp-tag">${p}</span>`);

                container.innerHTML += `
                    <div class="admin-card">
                        <div class="ac-header">
                            <div>
                                <div class="ac-title">${d.title}</div>
                                <div class="ac-artist">${d.artist} • ${d.genre}</div>
                                ${d.status === 'Запрос на удаление с площадок' ? '<div style="color:var(--danger); font-size:10px; font-weight:800; margin-top:5px;">ЗАПРОС УДАЛЕНИЯ</div>' : ''}
                                <div class="dsp-tags">${dspHtml}</div>
                            </div>
                        </div>

                        <div class="ac-links">
                            <a href="${d.audioUrl}" target="_blank" class="ac-link-btn" style="color:#3B82F6; border-color:rgba(59,130,246,0.3);">WAV</a>
                            <a href="${d.coverUrl}" target="_blank" class="ac-link-btn" style="color:#F59E0B; border-color:rgba(245,158,11,0.3);">Обложка</a>
                        </div>

                        <div class="ac-inputs">
                            <div><label>UPC</label><input type="text" id="upc-${d.id}" value="${d.upc || ''}"></div>
                            <div><label>ISRC</label><input type="text" id="isrc-${d.id}" value="${d.isrc || ''}"></div>
                            <div><label>Причина отмены</label><textarea id="reason-${d.id}" rows="2">${d.rejectReason || ''}</textarea></div>
                        </div>

                        <div class="ac-actions">
                            <select id="status-${d.id}">
                                <option value="Ожидает модерации" ${isPending}>Ожидает модерации</option>
                                <option value="Одобрено" ${isApproved}>Одобрено (На площадки)</option>
                                <option value="Отклонено" ${isRejected}>Отклонено (Правки)</option>
                                <option value="Запрос на удаление с площадок" ${isDelRequest}>Запрос удаления</option>
                            </select>
                            <button class="btn-save" data-id="${d.id}">Сохранить статус</button>
                            <button class="btn-delete" data-id="${d.id}">Удалить из БД</button>
                        </div>
                    </div>`;
            });

            document.querySelectorAll('.btn-save').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.target.getAttribute('data-id');
                    try {
                        await updateDoc(doc(db, "track_submissions", id), {
                            status: document.getElementById(`status-${id}`).value,
                            upc: document.getElementById(`upc-${id}`).value.trim(),
                            isrc: document.getElementById(`isrc-${id}`).value.trim(),
                            rejectReason: document.getElementById(`reason-${id}`).value.trim()
                        });
                        notify("Сохранено!");
                    } catch { notify("Ошибка", "error"); }
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    if (!confirm("Удалить навсегда?")) return;
                    try {
                        await deleteDoc(doc(db, "track_submissions", e.target.getAttribute('data-id')));
                        notify("Удалено"); loadReleases();
                    } catch { notify("Ошибка", "error"); }
                });
            });
        }

        document.getElementById('search-input').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            renderList(allSubmissions.filter(i => i.title.toLowerCase().includes(val) || i.artist.toLowerCase().includes(val)));
        });

        document.getElementById('status-filter').addEventListener('change', (e) => {
            const val = e.target.value;
            renderList(val === 'all' ? allSubmissions : allSubmissions.filter(i => i.status === val));
        });

        document.getElementById('export-csv-btn').addEventListener('click', () => {
            if (allSubmissions.length === 0) return notify("Пусто", "error");
            let csv = "ID,Title,Artist,Status,UPC,ISRC\n" + allSubmissions.map(r => `"${r.id}","${r.title}","${r.artist}","${r.status}","${r.upc||''}","${r.isrc||''}"`).join("\n");
            const link = document.createElement("a"); link.href = encodeURI("data:text/csv;charset=utf-8," + csv); link.download = "685_DB.csv"; link.click();
        });
    </script>
</body>
</html>
