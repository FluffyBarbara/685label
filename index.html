<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>685 Music | Портал Артиста</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Иконки -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #E91E63;
            --primary-hover: #C2185B;
            --bg-dark: #0F172A;
            --bg-panel: #1E293B;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border: #334155;
            --success: #10B981;
            --warning: #F59E0B;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; border: none; background: none; font-family: inherit; }
        input, select { font-family: inherit; }

        /* --- Toast Уведомления --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: var(--bg-panel); border-left: 4px solid var(--primary); padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: translateX(120%); transition: transform 0.3s ease; display: flex; align-items: center; gap: 12px; font-weight: 500; }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #EF4444; }
        .toast.success { border-left-color: var(--success); }

        /* --- ЭКРАН АВТОРИЗАЦИИ --- */
        #auth-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1E293B, #0F172A); padding: 20px; }
        .auth-card { background: var(--bg-panel); padding: 48px; border-radius: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); width: 100%; max-width: 440px; border: 1px solid var(--border); text-align: center; }
        .auth-logo { font-size: 32px; font-weight: 800; margin-bottom: 8px; letter-spacing: -1px; }
        .auth-logo span { color: var(--primary); }
        .auth-card p { color: var(--text-muted); margin-bottom: 32px; }
        
        .input-group { position: relative; margin-bottom: 20px; text-align: left; }
        .input-group i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-group input { width: 100%; background: #0F172A; border: 1px solid var(--border); color: var(--text-main); padding: 16px 16px 16px 48px; border-radius: var(--radius); font-size: 15px; transition: var(--transition); }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(233, 30, 99, 0.1); outline: none; }
        
        .btn-main { width: 100%; background: var(--primary); color: white; padding: 16px; border-radius: var(--radius); font-size: 16px; font-weight: 600; transition: var(--transition); }
        .btn-main:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-main:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        
        .auth-switch { margin-top: 24px; color: var(--text-muted); font-size: 14px; font-weight: 500; transition: var(--transition); display: inline-block; }
        .auth-switch:hover { color: var(--text-main); }

        /* --- ГЛАВНОЕ ПРИЛОЖЕНИЕ --- */
        #app-view { display: none; min-height: 100vh; }
        
        /* Боковая панель */
        .sidebar { width: 280px; background: var(--bg-panel); border-right: 1px solid var(--border); position: fixed; height: 100vh; padding: 32px 0; display: flex; flex-direction: column; z-index: 100; }
        .sidebar-logo { padding: 0 32px 40px; font-size: 28px; font-weight: 800; letter-spacing: -1px; }
        .sidebar-logo span { color: var(--primary); }
        .nav-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
        .nav-item { display: flex; align-items: center; gap: 16px; padding: 14px 24px; color: var(--text-muted); font-weight: 600; border-radius: 12px; transition: var(--transition); }
        .nav-item i { font-size: 18px; width: 20px; text-align: center; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .nav-item.active { background: var(--primary); color: white; }
        
        /* Основной контент */
        .main-content { margin-left: 280px; padding: 40px 60px; min-height: 100vh; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 48px; }
        .page-title { font-size: 24px; font-weight: 700; }
        .user-widget { display: flex; align-items: center; gap: 16px; background: var(--bg-panel); padding: 8px 16px; border-radius: 50px; border: 1px solid var(--border); }
        .user-avatar { width: 36px; height: 36px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .logout-btn { color: var(--text-muted); transition: var(--transition); margin-left: 8px; }
        .logout-btn:hover { color: #EF4444; }

        /* --- СТРАНИЦЫ --- */
        .page-section { display: none; animation: fadeIn 0.4s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Форма релиза */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 14px; font-weight: 600; color: var(--text-muted); }
        .form-input { background: var(--bg-panel); border: 1px solid var(--border); color: var(--text-main); padding: 16px; border-radius: var(--radius); transition: var(--transition); }
        .form-input:focus { border-color: var(--primary); outline: none; }
        select.form-input { appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394A3B8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 16px center; background-size: 16px; }
        
        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 24px; }
        .card-header { font-size: 18px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 12px; }
        .card-header i { color: var(--primary); }
        
        .platforms-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .platform-label { display: flex; align-items: center; gap: 12px; background: #0F172A; padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; transition: var(--transition); }
        .platform-label:hover { border-color: var(--primary); }
        .platform-label input { accent-color: var(--primary); width: 18px; height: 18px; }

        /* Список треков */
        .releases-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px; }
        .release-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; padding: 24px; transition: var(--transition); display: flex; flex-direction: column; gap: 16px; }
        .release-card:hover { border-color: var(--primary); transform: translateY(-4px); }
        .status-badge { align-self: flex-start; padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-pending { background: rgba(245, 158, 11, 0.1); color: var(--warning); }
        .status-approved { background: rgba(16, 185, 129, 0.1); color: var(--success); }
        .release-info h3 { font-size: 20px; margin-bottom: 4px; }
        .release-info p { color: var(--text-muted); font-size: 14px; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }

        /* Loader */
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- ЭКРАН АВТОРИЗАЦИИ -->
    <div id="auth-view">
        <div class="auth-card">
            <div class="auth-logo">685 <span>music</span></div>
            <p id="auth-subtitle">Вход в панель управления артиста</p>
            
            <div class="input-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="auth-email" placeholder="E-mail адрес" required>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="auth-password" placeholder="Пароль (минимум 6 символов)" required>
            </div>
            
            <button class="btn-main" id="auth-btn">Войти в систему</button>
            <button class="auth-switch" id="auth-switch-mode">Создать аккаунт артиста</button>
        </div>
    </div>

    <!-- ГЛАВНОЕ ПРИЛОЖЕНИЕ -->
    <div id="app-view">
        
        <aside class="sidebar">
            <div class="sidebar-logo">685 <span>music</span></div>
            <nav class="nav-menu">
                <button class="nav-item active" data-target="dashboard">
                    <i class="fa-solid fa-layer-group"></i> Мои релизы
                </button>
                <button class="nav-item" data-target="new-release">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Загрузить трек
                </button>
                <button class="nav-item" data-target="settings">
                    <i class="fa-solid fa-gear"></i> Настройки
                </button>
            </nav>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <h1 class="page-title" id="current-page-title">Мои релизы</h1>
                <div class="user-widget">
                    <div class="user-avatar" id="user-initial">A</div>
                    <span id="user-display-email" style="font-weight: 600; font-size: 14px;"></span>
                    <button class="logout-btn" id="logout-btn" title="Выйти"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <!-- Раздел: Мои Релизы -->
            <section class="page-section active" id="dashboard">
                <div class="releases-grid" id="releases-container">
                    <!-- Треки будут загружаться сюда скриптом -->
                    <div style="grid-column: 1/-1; text-align: center;"><div class="loader"></div></div>
                </div>
            </section>

            <!-- Раздел: Новый релиз -->
            <section class="page-section" id="new-release">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-circle-info"></i> Основная информация</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Название релиза *</label>
                            <input type="text" id="r-title" class="form-input" placeholder="Например: В темноте">
                        </div>
                        <div class="form-group">
                            <label>Исполнитель *</label>
                            <input type="text" id="r-artist" class="form-input" placeholder="Псевдоним артиста">
                        </div>
                        <div class="form-group">
                            <label>Жанр *</label>
                            <select id="r-genre" class="form-input">
                                <option value="Hip-Hop">Hip-Hop / Rap</option>
                                <option value="Pop">Pop</option>
                                <option value="Rock">Rock</option>
                                <option value="R&B">R&B</option>
                                <option value="Phonk">Phonk</option>
                                <option value="Electronic">Electronic</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-link"></i> Материалы (Облачные ссылки)</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Ссылка на обложку (Google Drive / Yandex) *</label>
                            <input type="url" id="r-cover" class="form-input" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Ссылка на WAV мастер-файл *</label>
                            <input type="url" id="r-audio" class="form-input" placeholder="https://...">
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-music"></i> Площадки для дистрибуции</div>
                    <div class="platforms-grid">
                        <label class="platform-label"><input type="checkbox" class="platform-cb" value="Apple Music" checked> Apple Music</label>
                        <label class="platform-label"><input type="checkbox" class="platform-cb" value="Spotify" checked> Spotify</label>
                        <label class="platform-label"><input type="checkbox" class="platform-cb" value="VK Музыка" checked> VK Музыка</label>
                        <label class="platform-label"><input type="checkbox" class="platform-cb" value="Яндекс Музыка" checked> Яндекс Музыка</label>
                        <label class="platform-label"><input type="checkbox" class="platform-cb" value="Звук" checked> Звук</label>
                        <label class="platform-label"><input type="checkbox" class="platform-cb" value="TikTok" checked> TikTok</label>
                    </div>
                </div>

                <div style="text-align: right;">
                    <button class="btn-main" id="submit-release-btn" style="width: auto; padding: 16px 40px;">Отправить на модерацию <i class="fa-solid fa-paper-plane" style="margin-left: 8px;"></i></button>
                </div>
            </section>

            <!-- Раздел: Настройки -->
            <section class="page-section" id="settings">
                <div class="card">
                    <div class="card-header"><i class="fa-solid fa-shield-halved"></i> Настройки аккаунта</div>
                    <p style="color: var(--text-muted); margin-bottom: 20px;">Ваш аккаунт надежно защищен технологиями Firebase Auth.</p>
                    <div class="form-group" style="max-width: 400px;">
                        <label>Ваш E-mail</label>
                        <input type="text" class="form-input" id="setting-email" disabled>
                    </div>
                </div>
            </section>

        </main>
    </div>

    <!-- FIREBASE & ЛОГИКА -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

        // ВАШИ КЛЮЧИ FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCv98EY58S0QR9TTh87u8xgX_x4QuEcZAU",
            authDomain: "music-label-e2581.firebaseapp.com",
            databaseURL: "https://music-label-e2581-default-rtdb.firebaseio.com",
            projectId: "music-label-e2581",
            storageBucket: "music-label-e2581.firebasestorage.app",
            messagingSenderId: "523951358095",
            appId: "1:523951358095:web:b09a4a0d9a910c52e070fa",
            measurementId: "G-GKPR5HKE62"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        /* --- СИСТЕМА УВЕДОМЛЕНИЙ --- */
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-check-circle' : 'fa-triangle-exclamation'}"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        /* --- ОБРАБОТКА ОШИБОК FIREBASE НА РУССКОМ --- */
        function translateAuthError(code) {
            switch (code) {
                case 'auth/invalid-email': return 'Неверный формат почты.';
                case 'auth/user-not-found': return 'Пользователь не найден. Зарегистрируйтесь.';
                case 'auth/wrong-password': return 'Неверный пароль.';
                case 'auth/email-already-in-use': return 'Эта почта уже зарегистрирована.';
                case 'auth/weak-password': return 'Пароль слишком слабый (минимум 6 символов).';
                case 'auth/unauthorized-domain': return 'Домен заблокирован. Добавьте его в Firebase Console.';
                default: return 'Произошла ошибка проверки данных.';
            }
        }

        /* --- АВТОРИЗАЦИЯ --- */
        let isLogin = true;
        const authBtn = document.getElementById('auth-btn');
        const switchBtn = document.getElementById('auth-switch-mode');
        const emailInp = document.getElementById('auth-email');
        const passInp = document.getElementById('auth-password');

        switchBtn.addEventListener('click', () => {
            isLogin = !isLogin;
            document.getElementById('auth-subtitle').innerText = isLogin ? "Вход в панель управления артиста" : "Создание нового аккаунта";
            authBtn.innerText = isLogin ? "Войти в систему" : "Создать аккаунт";
            switchBtn.innerText = isLogin ? "Создать аккаунт артиста" : "Уже есть аккаунт? Войти";
        });

        authBtn.addEventListener('click', async () => {
            if(!emailInp.value || !passInp.value) return showToast("Заполните все поля", "error");
            authBtn.innerHTML = '<div class="loader"></div>';
            authBtn.disabled = true;

            try {
                if (isLogin) await signInWithEmailAndPassword(auth, emailInp.value, passInp.value);
                else await createUserWithEmailAndPassword(auth, emailInp.value, passInp.value);
            } catch (error) {
                showToast(translateAuthError(error.code), "error");
                authBtn.innerText = isLogin ? "Войти в систему" : "Создать аккаунт";
                authBtn.disabled = false;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-view').style.display = 'none';
                document.getElementById('app-view').style.display = 'block';
                document.getElementById('user-display-email').innerText = user.email;
                document.getElementById('setting-email').value = user.email;
                document.getElementById('user-initial').innerText = user.email.charAt(0).toUpperCase();
                loadMyReleases(user.uid); // Загрузка треков пользователя
            } else {
                document.getElementById('auth-view').style.display = 'flex';
                document.getElementById('app-view').style.display = 'none';
                authBtn.innerText = isLogin ? "Войти в систему" : "Создать аккаунт";
                authBtn.disabled = false;
            }
        });

        /* --- НАВИГАЦИЯ ПО РАЗДЕЛАМ --- */
        const navItems = document.querySelectorAll('.nav-item');
        const sections = document.querySelectorAll('.page-section');
        const titleMap = { 'dashboard': 'Мои релизы', 'new-release': 'Загрузить трек', 'settings': 'Настройки' };

        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(n => n.classList.remove('active'));
                sections.forEach(s => s.classList.remove('active'));
                
                item.classList.add('active');
                const targetId = item.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
                document.getElementById('current-page-title').innerText = titleMap[targetId];
                
                if(targetId === 'dashboard' && auth.currentUser) loadMyReleases(auth.currentUser.uid);
            });
        });

        /* --- ОТПРАВКА НОВОГО РЕЛИЗА --- */
        document.getElementById('submit-release-btn').addEventListener('click', async () => {
            const title = document.getElementById('r-title').value.trim();
            const artist = document.getElementById('r-artist').value.trim();
            const genre = document.getElementById('r-genre').value;
            const cover = document.getElementById('r-cover').value.trim();
            const audio = document.getElementById('r-audio').value.trim();
            
            const platforms = Array.from(document.querySelectorAll('.platform-cb:checked')).map(cb => cb.value);

            if (!title || !artist || !cover || !audio) {
                return showToast("Заполните все обязательные поля со ссылками", "error");
            }

            const btn = document.getElementById('submit-release-btn');
            btn.innerHTML = '<div class="loader"></div>';
            btn.disabled = true;

            try {
                await addDoc(collection(db, "track_submissions"), {
                    userId: auth.currentUser.uid,
                    userEmail: auth.currentUser.email,
                    artist, title, genre, platforms, coverUrl: cover, audioUrl: audio,
                    status: "Ожидает модерации",
                    createdAt: serverTimestamp()
                });

                showToast("Релиз успешно отправлен на модерацию!");
                // Очистка формы
                ['r-title', 'r-artist', 'r-cover', 'r-audio'].forEach(id => document.getElementById(id).value = '');
                
                // Переход на главную
                document.querySelector('[data-target="dashboard"]').click();
            } catch (error) {
                showToast("Ошибка при отправке в базу", "error");
            } finally {
                btn.innerHTML = 'Отправить на модерацию <i class="fa-solid fa-paper-plane" style="margin-left: 8px;"></i>';
                btn.disabled = false;
            }
        });

        /* --- ЗАГРУЗКА РЕЛИЗОВ ПОЛЬЗОВАТЕЛЯ ИЗ БАЗЫ --- */
        async function loadMyReleases(uid) {
            const container = document.getElementById('releases-container');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center;"><div class="loader"></div></div>';
            
            try {
                // Создаем запрос: получить треки ТОЛЬКО текущего пользователя
                const q = query(collection(db, "track_submissions"), where("userId", "==", uid));
                const querySnapshot = await getDocs(q);
                
                container.innerHTML = ''; // Очищаем контейнер

                if (querySnapshot.empty) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-music"></i>
                            <h3>У вас пока нет релизов</h3>
                            <p>Перейдите в раздел "Загрузить трек", чтобы отправить первую работу.</p>
                        </div>`;
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const statusClass = data.status === "Ожидает модерации" ? "status-pending" : "status-approved";
                    const date = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleDateString('ru-RU') : 'Недавно';

                    container.innerHTML += `
                        <div class="release-card">
                            <div class="status-badge ${statusClass}">${data.status}</div>
                            <div class="release-info">
                                <h3>${data.title}</h3>
                                <p><i class="fa-solid fa-microphone-lines"></i> ${data.artist}</p>
                                <p style="margin-top: 8px;"><i class="fa-solid fa-compact-disc"></i> ${data.genre} • ${date}</p>
                            </div>
                        </div>`;
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="empty-state">Ошибка загрузки треков. Проверьте права доступа.</div>';
            }
        }
    </script>
</body>
</html>
